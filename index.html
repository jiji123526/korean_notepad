<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>한글 노트</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">한</span>
          <span>
            <strong>한글 노트</strong>
            <small>write freely, copy anywhere</small>
          </span>
        </div>

        <div class="top-actions">
          <span id="save-status" class="save-status">저장됨</span>
          <button id="copy-button" class="copy-button" type="button">전체 복사</button>
          <button id="clear-button" class="text-button" type="button">지우기</button>
        </div>
      </header>

      <section class="writing-area">
        <div class="date-line" id="date-line"></div>
        <input id="title" class="title" type="text" value="오늘의 기록" aria-label="노트 제목" />
        <textarea
          id="note"
          class="note"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          placeholder="여기에 한국어로 써보세요..."
          aria-label="노트 내용"
        ></textarea>
        <div class="note-footer">
          <span>브라우저에 자동 저장됩니다</span>
          <span id="character-count">0자</span>
        </div>
      </section>

      <section class="keyboard-section">
        <div class="keyboard-heading">
          <div>
            <h2>한글 자판</h2>
            <p>영문 키보드로 입력하세요. <code>dkssud</code> → 안녕 · Shift + 자음 → ㄲ/ㄸ/ㅃ/ㅆ/ㅉ</p>
          </div>
          <button id="keyboard-toggle" class="keyboard-toggle" type="button" aria-expanded="true">자판 숨기기</button>
        </div>
        <div id="keyboard" class="keyboard" aria-label="한글 2벌식 자판"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
